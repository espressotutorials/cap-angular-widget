<main>
  <section>
    <p class="eyebrow">Angular wrapper for Cap</p>
    <h1>CAP Angular Widget</h1>
    <p>
      Enter your Cap Standalone endpoint, then solve the proof-of-work
      challenge. The endpoint must include the site key and trailing slash.
    </p>

    <label for="endpoint">Cap API endpoint</label>
    <input id="endpoint" type="url" [(ngModel)]="endpoint" />

    <capjs-widget
      [formControl]="captcha"
      [endpoint]="endpoint"
      [required]="true"
      (solve)="onSolve($event)"
      (errorDetail)="onError($event)"
    />

    <output>{{ status }}</output>
  </section>
</main>
