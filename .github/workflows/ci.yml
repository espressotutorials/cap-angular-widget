name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci --include=dev 2>&1 | tee npm-ci.log
      - name: Report install failure
        if: failure() && steps.install.outcome == 'failure'
        run: |
          while IFS= read -r line; do
            echo "::error file=package-lock.json::$line"
          done < <(tail -n 30 npm-ci.log)
      - run: npm test
      - run: npm run test:demo
      - run: npm run build
